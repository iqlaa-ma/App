services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-auth-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
      - SECRET_KEY=${SECRET_KEY:-changeme-generate-a-secure-key}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - APP_NAME=Mobile Auth API
      - DEBUG=True
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./tests:/app/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - auth-network

networks:
  auth-network:
    driver: bridge